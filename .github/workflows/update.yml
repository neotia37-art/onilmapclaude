name: 데이터 갱신

on:
  schedule:
    - cron: '10 7 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'data/watchlist.json'
      - 'build_data.py'

permissions:
  contents: write

# 관심종목 푸시와 스케줄이 겹치면 checkout 이후 main이 앞서고 push가 거절된다.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy finance-datareader yfinance pykrx lxml html5lib beautifulsoup4 requests

      - name: 데이터 생성
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python build_data.py

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "푸시 성공 (시도 $i)"
                exit 0
              fi
              echo "푸시 거절, 재시도 $i"
            else
              echo "리베이스 충돌 — 원격 우선 후 데이터만 다시 커밋"
              git rebase --abort || true
              git fetch origin main
              git reset --soft origin/main
              git add data/
              if git diff --staged --quiet; then
                echo "원격이 이미 같은 데이터"
                exit 0
              fi
              git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            fi
            sleep $((i * 3))
          done
          echo "푸시 실패"
          exit 1
