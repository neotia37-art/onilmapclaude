<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FAF9F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오닐">
<title>오닐 터미널</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+KR:wght@700&display=swap');
:root{
  --paper:#FAF9F6;--card:#fff;--wash:#F3F0EA;--line:#E5E1D8;--line2:#CFC9BC;
  --ink:#16181C;--ink2:#4E555D;--ink3:#7C848D;--acc:#8A5A00;--accbg:#FDF6E7;
  --up:#0B7A52;--upbg:#E9F5F0;--dn:#B3261E;--dnbg:#FBECEA;--info:#1F4E79;--infobg:#ECF2F8;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:'Pretendard',-apple-system,system-ui,sans-serif;overscroll-behavior-y:contain}
body{padding-bottom:calc(64px + var(--sb))}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.acc{color:var(--acc)}.mut{color:var(--ink3)}
header{position:sticky;top:0;z-index:50;background:rgba(250,249,246,.95);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  padding:calc(var(--st) + 9px) 14px 9px}
header .row{display:flex;align-items:center;gap:9px}
header h1{font-family:'Noto Serif KR',serif;font-size:16px;margin:0;flex:1}
header .as{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3)}
.iconbtn{width:33px;height:33px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:var(--ink2)}
main{padding:12px 13px 20px;max-width:780px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--sb);display:flex}
nav button{flex:1;border:0;background:none;padding:7px 1px 6px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:2px;color:var(--ink3);font-size:9.5px;position:relative}
nav button .ic{font-size:16px;line-height:1}
nav button.on{color:var(--acc);font-weight:700}
nav .badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--dn);color:#fff;
  border-radius:9px;font-size:9px;padding:0 5px;font-weight:700;line-height:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;
  margin-bottom:10px;box-shadow:0 1px 2px rgba(20,20,20,.035)}
.card.tap{cursor:pointer}.card.tap:active{transform:scale(.985)}
.k{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);font-weight:600}
.v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;margin:3px 0 2px;line-height:1.15}
.d{font-size:11.5px;color:var(--ink2);line-height:1.55}
.hero .v{font-family:'Noto Serif KR',serif;font-size:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.grid2 .card,.grid3 .card{margin:0}
.grid3 .card{padding:9px}.grid3 .v{font-size:16px}
.tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 7px;
  border-radius:6px;font-weight:600}
.t-pass{background:var(--upbg);color:var(--up);border:1px solid #A8D5C2}
.t-fail{background:var(--dnbg);color:var(--dn);border:1px solid #EFB8B2}
.t-warn{background:var(--accbg);color:var(--acc);border:1px solid #E5CE9A}
.t-idle{background:var(--wash);color:var(--ink2);border:1px solid var(--line2)}
.t-info{background:var(--infobg);color:var(--info);border:1px solid #B9CDE0}
.bar{height:8px;background:var(--wash);border-radius:5px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.bar>i{display:block;height:100%}
h2.sec{font-family:'Noto Serif KR',serif;font-size:14px;margin:19px 0 8px;display:flex;align-items:center;gap:7px}
h2.sec::before{content:"";width:3px;height:13px;background:var(--acc);border-radius:2px}
h2.sec small{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);font-weight:400}
.read{background:var(--accbg);border:1px solid #EBDCB8;border-radius:11px;padding:11px 12px;
  font-size:12px;line-height:1.75;margin-bottom:10px}
.read b{color:var(--acc)}
.read .h{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--acc);
  text-transform:uppercase;display:block;margin-bottom:5px;font-weight:700}
.read.blue{background:var(--infobg);border-color:#C6D8E7}
.read.blue .h,.read.blue b{color:var(--info)}
ul.acts{margin:7px 0 0;padding:0;list-style:none}
ul.acts li{position:relative;padding:7px 0 7px 19px;font-size:12px;line-height:1.65;border-top:1px dotted var(--line)}
ul.acts li:first-child{border-top:0}
ul.acts li::before{content:"→";position:absolute;left:1px;color:var(--acc);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);text-align:left;padding:6px;background:var(--wash);border-bottom:1px solid var(--line);font-weight:600}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;gap:9px}.row .g{flex:1;min-width:0}
.nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10.5px;color:var(--ink3);margin-top:2px;font-family:'IBM Plex Mono',monospace}
.px{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600;text-align:right}
input,select{width:100%;padding:10px 11px;border:1px solid var(--line2);border-radius:10px;
  background:var(--card);color:var(--ink);outline:none;font-family:inherit;font-size:14px}
input:focus{border-color:var(--acc)}
button.btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);
  color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:13.5px}
button.btn.ghost{background:var(--card);color:var(--acc)}
button.btn.gray{background:var(--card);color:var(--ink2);border-color:var(--line2)}
button.btn.sm{padding:8px 11px;font-size:12px;width:auto}
.frow{display:flex;gap:7px;margin-bottom:8px}
canvas{width:100%;display:block;border-radius:8px}
.chartbox{border:1px solid var(--line);border-radius:11px;padding:7px;background:var(--card);margin-bottom:10px}
.alert{border-radius:11px;padding:10px 11px;margin-bottom:8px;border:1px solid;font-size:12px;cursor:pointer}
.alert.buy{background:var(--upbg);border-color:#A8D5C2}
.alert.near{background:var(--accbg);border-color:#E5CE9A}
.alert.sell{background:var(--dnbg);border-color:#EFB8B2}
.alert .t{font-weight:700;font-size:12.5px;margin-bottom:2px}
.alert .b{color:var(--ink2);font-size:11px;line-height:1.5}
.empty{text-align:center;padding:32px 14px;color:var(--ink3);font-size:12.5px;line-height:1.7}
.view{display:none}.view.on{display:block}
.chip{display:inline-block;padding:4px 9px;border-radius:14px;background:var(--wash);
  border:1px solid var(--line);font-size:11px;margin:0 5px 5px 0;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line2);border-top-color:var(--acc);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hr{height:1px;background:var(--line);margin:14px 0}
.small{font-size:10.5px;color:var(--ink3);line-height:1.6}
details{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:10px 12px;margin-bottom:10px}
summary{font-size:12.5px;font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"⌄";float:right;color:var(--ink3)}
details[open] summary::after{content:"⌃"}
details .body{margin-top:10px;font-size:11.5px;line-height:1.7;color:var(--ink2)}
.searchbar{display:flex;gap:7px;margin-bottom:11px}
.searchbar input{flex:1}
.gauge{position:relative;height:9px;border-radius:5px;margin:8px 0 4px;
  background:linear-gradient(90deg,#B3261E,#E5A83C,#CFC9BC,#7FBF9A,#0B7A52)}
.gauge i{position:absolute;top:-4px;width:3px;height:17px;background:var(--ink);border-radius:2px}
.glabel{display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);
  font-family:'IBM Plex Mono',monospace}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.quiz .q{font-size:12.5px;font-weight:600;margin-bottom:8px;line-height:1.5}
.quiz .opt{display:block;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line2);
  border-radius:9px;background:var(--paper);margin-bottom:6px;font-size:12px;cursor:pointer;font-family:inherit}
.quiz .opt.ok{background:var(--upbg);border-color:#A8D5C2;color:var(--up);font-weight:700}
.quiz .opt.no{background:var(--dnbg);border-color:#EFB8B2;color:var(--dn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--sb));z-index:99;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:22px;font-size:12.5px;
  box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="row">
  <h1 id="hdTitle">오닐 터미널</h1>
  <span class="as" id="hdAs">—</span>
  <button class="iconbtn" id="btnRefresh">↻</button>
</div></header>
<main>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-market"></section>
  <section class="view" id="v-stocks"></section>
  <section class="view" id="v-school"></section>
  <section class="view" id="v-my"></section>
  <section class="view" id="v-set"></section>
</main>
<nav>
  <button data-v="home" class="on"><span class="ic">◎</span>홈<span class="badge" id="nbAlert" style="display:none">0</span></button>
  <button data-v="market"><span class="ic">◫</span>시장</button>
  <button data-v="stocks"><span class="ic">▤</span>종목</button>
  <button data-v="school"><span class="ic">✎</span>차트스쿨</button>
  <button data-v="my"><span class="ic">◈</span>내투자</button>
  <button data-v="set"><span class="ic">⚙</span>설정</button>
</nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
const DB={get(k,d){try{const v=localStorage.getItem('oneil:'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('oneil:'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('oneil:'+k)}catch(e){}}};
let SUM=DB.get('cache:summary',null), DETAIL={}, CUR='home', SELECTED=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(v,d=2){return (v==null||isNaN(v))?'—':Number(v).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d})}
function money(v,mk){return (v==null||isNaN(v))?'—':(mk==='KR'?Math.round(v).toLocaleString('ko-KR'):Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}))}
function unit(mk){return mk==='KR'?'원':'$'}
function pct(v,d=1){return (v==null||isNaN(v))?'—':((v>=0?'+':'')+Number(v).toFixed(d)+'%')}
function cls(v){return v==null?'':(v>=0?'up':'dn')}
const KIND={pass:'t-pass',warn:'t-warn',fail:'t-fail',idle:'t-idle',info:'t-info'};
const tag=(t,k)=>`<span class="tag ${KIND[k]||'t-idle'}">${esc(t)}</span>`;
const bar=(v,mx,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,v/mx*100))}%;background:${c}"></i></div>`;
const C_UP='#0B7A52',C_DN='#B3261E',C_ACC='#8A5A00',C_INFO='#1F4E79';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
const isKR=c=>/^[0-9A-Z]{6}$/.test(c)&&/\d/.test(c);

/* ── 데이터 ── */
async function loadSummary(force){
  try{
    if(force){
      try{ localStorage.removeItem('oneil:cache:summary'); localStorage.removeItem('oneil:cache:at'); }catch(e){}
      DETAIL={};
    }
    const r=await fetch('data/summary.json?t='+(force?Date.now():Math.floor(Date.now()/300000)),
      {cache:force?'reload':'no-cache'});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json(); SUM=j; DB.set('cache:summary',j); DB.set('cache:at',Date.now()); return j;
  }catch(e){ if(SUM) return SUM; throw e; }
}
async function loadDetail(code){
  if(DETAIL[code]) return DETAIL[code];
  const cached=DB.get('cache:d:'+code,null);
  try{
    const r=await fetch('data/stock/'+encodeURIComponent(code)+'.json?t='+Math.floor(Date.now()/300000));
    if(!r.ok) throw new Error(r.status);
    const j=await r.json(); DETAIL[code]=j; DB.set('cache:d:'+code,j); return j;
  }catch(e){ if(cached){DETAIL[code]=cached; return cached;} return null; }
}

/* ── 알림 ── */
async function askNotify(){ if(!('Notification'in window))return'unsupported';
  if(Notification.permission==='granted')return'granted';
  try{return await Notification.requestPermission()}catch(e){return'denied'} }
function fireNotify(t,b,g){ if(!('Notification'in window)||Notification.permission!=='granted')return;
  try{ if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,tag:g,icon:'icon-192.png'}))
        .catch(()=>new Notification(t,{body:b,tag:g}));
    } else new Notification(t,{body:b,tag:g}); }catch(e){} }
function runAlerts(){
  if(!SUM)return;
  const seen=DB.get('alerts:seen',{}), now={}, fresh=[];
  (SUM.alerts||[]).forEach(a=>{const k=a.code+':'+a.level; now[k]=1; if(!seen[k])fresh.push(a)});
  DB.set('alerts:seen',now);
  const n=(SUM.alerts||[]).length, nb=$('#nbAlert');
  if(n>0){nb.style.display='';nb.textContent=n}else nb.style.display='none';
  if(DB.get('notify:on',false)){
    fresh.filter(a=>a.level!=='near').forEach(a=>fireNotify(a.title,a.body,a.level+':'+a.code));
    const nr=fresh.filter(a=>a.level==='near');
    if(nr.length) fireNotify(`피봇 임박 ${nr.length}종목`, nr.map(x=>x.name||x.code).join(', '),'near');
  }
}

/* ── 차트 ── */
function lineChart(cv,series,o){
  o=o||{}; const dpr=devicePixelRatio||1,W=cv.clientWidth,H=o.height||150;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  if(!series||series.length<2)return;
  const vals=series.map(p=>p[1]).filter(v=>v!=null);
  const hl=(o.hlines||[]).map(h=>h.y).filter(v=>v!=null);
  let mn=Math.min(...vals,...hl),mx=Math.max(...vals,...hl);
  const pad=(mx-mn)*.08||1;mn-=pad;mx+=pad;
  const L=5,Rr=W-50,T=7,B=H-15;
  const X=i=>L+(Rr-L)*i/(series.length-1), Y=v=>B-(B-T)*(v-mn)/(mx-mn);
  if(o.band){const y1=Y(o.band[1]),y2=Y(o.band[0]);g.fillStyle='rgba(138,90,0,.11)';
    g.fillRect(L,Math.min(y1,y2),Rr-L,Math.abs(y2-y1));}
  (o.hlines||[]).forEach(h=>{if(h.y==null)return;g.strokeStyle=h.color||'#CFC9BC';g.lineWidth=1;
    g.setLineDash(h.dash||[4,3]);g.beginPath();g.moveTo(L,Y(h.y));g.lineTo(Rr,Y(h.y));g.stroke();g.setLineDash([]);
    if(h.label){g.fillStyle=h.color||'#7C848D';g.font='9px "IBM Plex Mono",monospace';g.textAlign='left';
      g.fillText(h.label,Rr+3,Y(h.y)+3)}});
  g.strokeStyle=o.color||'#16181C';g.lineWidth=1.7;g.lineJoin='round';g.beginPath();
  series.forEach((p,i)=>{i?g.lineTo(X(i),Y(p[1])):g.moveTo(X(i),Y(p[1]))});g.stroke();
  const gr=g.createLinearGradient(0,T,0,B);gr.addColorStop(0,o.fill||'rgba(138,90,0,.15)');
  gr.addColorStop(1,'rgba(138,90,0,0)');g.fillStyle=gr;
  g.lineTo(X(series.length-1),B);g.lineTo(L,B);g.closePath();g.fill();
  (o.marks||[]).forEach(m=>{const i=series.findIndex(p=>p[0]===m.date);if(i<0)return;
    g.fillStyle=m.color||C_UP;g.beginPath();g.arc(X(i),Y(series[i][1]),4,0,7);g.fill();
    if(m.label){g.font='700 9px "IBM Plex Mono",monospace';g.textAlign='center';
      g.fillText(m.label,X(i),Y(series[i][1])-8)}});
  g.fillStyle='#7C848D';g.font='9px "IBM Plex Mono",monospace';g.textAlign='left';
  g.fillText(series[0][0].slice(2),L,H-3);g.textAlign='right';
  g.fillText(series[series.length-1][0].slice(2),Rr,H-3);
}
function volChart(cv,series){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=42;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  if(!series||!series.length)return;
  const mx=Math.max(...series.map(p=>p[2]||0))||1,L=5,Rr=W-50,bw=Math.max(1,(Rr-L)/series.length-.5);
  series.forEach((p,i)=>{const up=i?p[1]>=series[i-1][1]:true;
    g.fillStyle=up?'rgba(11,122,82,.4)':'rgba(179,38,30,.4)';
    const h=(p[2]||0)/mx*(H-6);g.fillRect(L+(Rr-L)*i/series.length,H-3-h,bw,h)});
}

/* ══════════ 홈 ══════════ */
function renderHome(){
  const el=$('#v-home');
  if(!SUM){el.innerHTML=`<div class="empty">불러오는 중… <span class="spin"></span></div>`;return}
  const pref=DB.get('market:pref','US');
  const M=(SUM.markets||{})[pref]||(SUM.markets||{}).US||(SUM.markets||{}).KR;
  const alerts=SUM.alerts||[], items=(SUM.items||[]).filter(x=>!x.error);
  let h='';
  if(SUM.sample) h+=`<div class="alert near" style="border-style:dashed"><div class="t">샘플 데이터입니다</div>
    <div class="b">저장소 Actions 탭 → <b>데이터 갱신</b> → Run workflow 를 한 번 실행하면 실제 시세로 바뀝니다.</div></div>`;
  h+=searchBar();
  h+=`<h2 class="sec">오늘의 알림<small>${alerts.length}건</small></h2>`;
  if(alerts.length) alerts.slice(0,6).forEach(a=>{
    h+=`<div class="alert ${a.level}" onclick="openStock('${esc(a.code)}')"><div class="t">${esc(a.title)}</div>
      <div class="b">${esc(a.body)}</div></div>`});
  else h+=`<div class="card"><div class="d">매수 가능 구간·피봇 임박·매도 압력 종목이 없습니다.</div></div>`;
  if(M&&M.pulse){
    const p=M.pulse,k=p.state==='confirmed_uptrend'?'pass':p.state==='under_pressure'?'warn':'fail';
    const col=k==='pass'?C_UP:k==='warn'?C_ACC:C_DN;
    h+=`<h2 class="sec">시장<small>${pref==='KR'?'한국':'미국'}</small></h2>

function renderStocks(){
  const el=$('#v-stocks');
  if(!SUM){el.innerHTML=`<div class="empty">데이터 없음</div>`;return}
  const f=DB.get('filter:stock','all');
  const wl=watchlist();
  const sumMap={};
  (SUM.items||[]).forEach(x=>{sumMap[x.code]=x});
  const codes=Array.from(new Set([...wl, ...(SUM.items||[]).map(x=>x.code)]));
  let items=codes.map(code=>{
    if(sumMap[code]) return sumMap[code];
    return {code, name:code, kind:'idle', score:null, rs:null, price:null, chg:null, pivot:null, gap:null, market: /^\d{6}$/.test(code)?'KR':'US', pending:true};
  });
  const filt=items.filter(x=>{
    if(x.pending) return f==='all';
    if(x.error) return f==='all';
    if(f==='buy')return x.kind==='pass'; if(f==='near')return x.kind==='warn';
    if(f==='sell')return (x.sell||0)>=45; if(f==='kr')return x.market==='KR';
    if(f==='us')return x.market==='US'; return true });
  let h=searchBar()+`<div style="margin-bottom:11px">${
    [['all','전체'],['buy','매수구간'],['near','돌파대기'],['sell','매도경고'],['us','해외'],['kr','한국']]
    .map(c=>`<span class="chip ${c[0]===f?'on':''}" onclick="setFilter('${c[0]}')">${c[1]}</span>`).join('')}</div>`;
    const pendingCnt=items.filter(x=>x.pending).length;
  h+=`<div class="small" style="margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span>관심종목 ${wl.length}개 · 분석완료 ${Object.keys(sumMap).length}개</span>
    ${pendingCnt?`<span class="tag t-warn">대기 ${pendingCnt}</span>
    <button class="btn sm" style="padding:4px 10px;font-size:11px" onclick="triggerAnalysis()">지금 분석 실행</button>`:''}
  </div>`;
  if(!filt.length)h+=`<div class="empty">해당 종목이 없습니다.</div>`;
  const o={pass:0,warn:1,idle:2,fail:3};
  filt.slice().sort((a,b)=>{
    if(a.pending&&!b.pending)return 1; if(!a.pending&&b.pending)return -1;
    return (o[a.kind]??9)-(o[b.kind]??9)||(b.score||0)-(a.score||0);
  }).forEach(x=>{
    if(x.pending){
      h+=`<div class="card"><div class="row"><div class="g"><div class="nm">${esc(x.code)}</div>
        <div class="sub">분석 대기 중 · 관심목록에만 있음</div></div>
        <button class="btn gray sm" onclick="event.stopPropagation();removeFromWatch('${esc(x.code)}')">삭제</button></div>
        <div class="d" style="margin-top:6px">저장소에 반영 후 Actions가 돌면 분석 결과가 표시됩니다.</div></div>`;
    } else if(x.error){
      h+=`<div class="card"><div class="row"><div class="g"><div class="nm">${esc(x.name||x.code)}</div>
        <div class="sub">${esc(x.code)}</div></div>
        <button class="btn gray sm" onclick="event.stopPropagation();removeFromWatch('${esc(x.code)}')">삭제</button></div>
        <div class="d" style="margin-top:6px">${esc(x.error)}</div></div>`;
    } else {
      h+=stockRowWithDel(x);
    }
  });
  el.innerHTML=h;
}

async function triggerAnalysis(){
  if(!ghReady()){alert('설정에서 GitHub 연동을 먼저 해주세요.');return}
  const g=ghCfg();
  toast('분석 실행 요청 중…');
  try{
    const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/actions/workflows/update.yml/dispatches`,{
      method:'POST',
      headers:{'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({ref:g.branch||'main'})
    });
    if(r.status===204||r.ok){
      toast('분석이 시작되었습니다. 1~2분 후 자동 반영됩니다.');
      if(!window._pollTimer){
        window._pollTimer=setInterval(async()=>{
          try{
            await loadSummary(true);
            const still=watchlist().filter(c=>!(SUM.items||[]).find(x=>x.code===c));
            if(!still.length){clearInterval(window._pollTimer);window._pollTimer=null;toast('분석 완료!');}
            if(CUR==='stocks') renderStocks();
            else if(CUR==='home') renderHome();
          }catch(e){}
        },25000);
      }
    } else {
      const t=await r.text();
      throw new Error(r.status+' '+t.slice(0,100));
    }
  }catch(e){
    alert('분석 실행 실패: '+e.message+'\n\n토큰에 Actions 쓰기 권한이 필요할 수 있습니다.\nFine-grained token → Permissions → Actions: Read and write');
  }
}
  function wlDel(i){const wl=watchlist();const code=wl[i];wl.splice(i,1);DB.set('watchlist',wl);renderSet();
  if(ghReady()) pushWatchlist(wl).then(ok=>{if(ok)toast(code+' 삭제 + 저장소 반영')})}
async function removeFromWatch(code){
  code=String(code||'').trim().toUpperCase();
  if(!code)return;
  if(!confirm(code+' 를 관심종목에서 삭제할까요?'))return;
  const wl=watchlist().filter(c=>c!==code);
  DB.set('watchlist',wl);
  toast(code+' 삭제됨');
  if(ghReady()){
    const ok=await pushWatchlist(wl);
    if(ok) toast(code+' 저장소에서도 제거됨');
  }
  if(CUR==='stocks') renderStocks();
  else if(CUR==='set') renderSet();
  else if(CUR==='home') renderHome();
}

function fmtBig(v){ if(v==null)return '—';
  const av=Math.abs(v);
  if(av>=1e12)return (v/1e12).toFixed(1)+'조'; if(av>=1e8)return (v/1e8).toFixed(0)+'억';
  if(av>=1e6)return (v/1e6).toFixed(0)+'M'; return Number(v).toLocaleString('ko-KR')}
function fmtCap(v,mk){ if(v==null)return '—';
  return mk==='KR'?(v>=1e12?(v/1e12).toFixed(1)+'조원':(v/1e8).toFixed(0)+'억원'):'$'+(v/1e9).toFixed(1)+'B'}
function chgS(g){ if(g==null)return '';
  const t=g===999?'흑자전환':((g>=0?'+':'')+g.toFixed(0)+'%');
  return `<br><span class="small ${g>=25?'up':g>=0?'mut':'dn'}">${t}</span>`}

async function renderSchool(){

  const a=await loadDetail(code);
  const tip=TIPS[new Date().getDate()%TIPS.length];
  let h=`<div style="margin-bottom:11px">${items.slice(0,8).map(x=>
    `<span class="chip ${x.code===code?'on':''}" onclick="SELECTED='${esc(x.code)}';renderSchool()">${esc(x.name||x.code)}</span>`).join('')}</div>`;
  if(a&&a.base){const b=a.base,L=LESSON[b.type]||null;
    h+=`<div class="card hero"><div class="k">현재 패턴</div><div class="v">${esc(b.type)}</div>
      <div class="d">${esc(a.name)} · ${esc(b.start)} 시작 · ${b.weeks}주째 · 깊이 ${b.depth}% · ${b.count}차</div></div>`;
    if(L){h+=`<div class="read"><span class="h">왜 이 모양이 생기나</span>${esc(L.why)}</div>
      <div class="tbl"><table><tr><th>오닐의 합격 기준</th></tr>
        ${L.spec.map(s=>`<tr><td>${esc(s)}</td></tr>`).join('')}</table></div>
      <div class="tbl"><table><tr><th>흔한 함정</th></tr>
        ${L.trap.map(s=>`<tr><td>${esc(s)}</td></tr>`).join('')}</table></div>`}
    if(b.anatomy&&b.anatomy.length){
      const l=b.anatomy.find(s=>s.label.startsWith('①')),r=b.anatomy.find(s=>s.label.startsWith('②')),
            hd=b.anatomy.find(s=>s.label.startsWith('③'));
      let msg='';
      if(l&&r) msg+= r.vol>=l.vol
        ? `우측 회복 거래량(${r.vol}배)이 좌측 하락(${l.vol}배)보다 많습니다. <b>누군가 물량을 받아냈다</b>는 좋은 신호입니다. `
        : `우측 회복 거래량(${r.vol}배)이 좌측 하락(${l.vol}배)보다 적습니다. <b>매집 근거가 약합니다</b>. `;
      if(hd) msg+= hd.vol<1 ? `핸들 거래량이 ${hd.vol}배로 말랐습니다. <b>정상</b>입니다.`
                            : `핸들 거래량이 ${hd.vol}배로 여전히 많습니다. <b>털어낼 물량이 남았습니다</b>.`;
      h+=`<div class="read"><span class="h">거래량이 말하는 것</span>${msg}</div>`}
    h+=`<div class="chartbox"><canvas id="schcv"></canvas></div>
      <div class="small" style="margin-bottom:12px">노란 띠가 매수 구간, 가로선이 피봇, 점선이 손절선입니다.</div>`;
    h+=`<h2 class="sec">오늘의 문제</h2>`+quizHtml(a);
  } else h+=`<div class="card"><div class="d">이 종목은 현재 베이스가 없습니다. 아래 도감으로 모양을 익혀두세요.</div></div>`;
  h+=`<h2 class="sec">패턴 도감</h2>`;
  Object.keys(LESSON).forEach(k=>{const L=LESSON[k],cur=a&&a.base&&a.base.type===k;
    h+=`<details ${cur?'open':''}><summary>${esc(k)}${cur?' ← 현재':''}</summary><div class="body">
      <b>왜 생기나</b> · ${esc(L.why)}<div class="hr"></div>
      <b>합격 기준</b><br>${L.spec.map(s=>'· '+esc(s)).join('<br>')}<div class="hr"></div>
      <b>함정</b><br>${L.trap.map(s=>'· '+esc(s)).join('<br>')}</div></details>`});
  h+=`<h2 class="sec">오늘의 오닐 한 마디</h2>
    <div class="card"><div class="k">오늘의 원칙</div><div class="v" style="font-size:15px">${esc(tip[0])}</div>
    <div class="d">${esc(tip[1])}</div></div>
    <details><summary>원칙 10가지 전체</summary><div class="body">
      ${TIPS.map(t=>`<b>${esc(t[0])}</b><br>${esc(t[1])}`).join('<div class="hr"></div>')}</div></details>`;
  el.innerHTML=h;
  requestAnimationFrame(()=>{const cv=document.getElementById('schcv');
    if(cv&&a){const hl=[{y:a.ma&&a.ma['50'],color:C_ACC,label:'50일'}];
      if(a.pivot)hl.push({y:a.pivot,color:C_ACC,dash:[],label:'피봇'});
      if(a.stop)hl.push({y:a.stop,color:C_DN,label:'손절'});
      lineChart(cv,a.series,{height:175,band:a.pivot?[a.pivot,a.buy_hi]:null,hlines:hl})}});
}
function quizHtml(a){
  const b=a.base,mk=a.market,Q=[];
  Q.push({q:`이 종목의 베이스 깊이는 ${b.depth}%입니다. 오닐 기준으로 정상일까요?`,
    o:['정상 (12~33%)','너무 얕음','너무 깊음'],
    ans:(b.depth>=12&&b.depth<=33)?0:(b.depth<12?1:2),
    why:`오닐은 깊이 12~33%를 정상으로 봤습니다. 33%를 넘으면 되돌릴 힘이 더 필요해 실패율이 오릅니다. 현재 ${b.depth}%.`});
  Q.push({q:`현재가는 피봇(${money(a.pivot,mk)}) 대비 ${pct(a.gap)}입니다. 지금 사도 될까요?`,
    o:['산다','돌파를 기다린다','사지 않는다'],
    ans:a.kind==='pass'?0:(a.kind==='warn'||a.kind==='idle')?1:2,
    why:a.kind==='pass'?'피봇 위 5% 이내로 오닐이 말한 유일한 매수 자리입니다. 거래량 1.4배 확인은 필수.'
      :a.kind==='fail'?'연장되었거나 이미 돌파가 끝났습니다. 늦게 사면 손절선이 베이스 안으로 들어옵니다.'
      :'미리 사지 마세요. 돌파를 확인하고 사는 것이 몇 % 비싸 보여도 실패 확률을 크게 낮춥니다.'});
  Q.push({q:`베이스 차수는 ${b.count}차입니다. 무엇을 의미할까요?`,
    o:['초기 단계라 안전한 편','후기 단계라 실패율이 높음'],ans:b.count<=2?0:1,
    why:`상승 과정의 베이스는 뒤로 갈수록 실패율이 높아집니다. 1~2차는 시장이 아직 덜 알아본 단계입니다. 현재 ${b.count}차.`});
  return Q.map((q,i)=>`<div class="quiz"><div class="q">${i+1}. ${esc(q.q)}</div>
    ${q.o.map((o,j)=>`<button class="opt" id="q${i}o${j}" onclick="ansQuiz(${i},${j},${q.ans})">${esc(o)}</button>`).join('')}
    <div class="small" id="qw${i}" style="display:none;margin-top:6px">${esc(q.why)}</div></div>`).join('');
}
function ansQuiz(i,j,ans){
  document.querySelectorAll(`[id^="q${i}o"]`).forEach((b,k)=>{
    b.classList.remove('ok','no'); if(k===ans)b.classList.add('ok'); else if(k===j)b.classList.add('no')});
  const w=document.getElementById('qw'+i); if(w)w.style.display='';
}

const holdings=()=>DB.get('holdings',[]);
const saveH=h=>DB.set('holdings',h);
function addHolding(c){go('my');setTimeout(()=>{const i=document.getElementById('hCode');
  if(i){i.value=c;i.scrollIntoView({block:'center'})}},80)}
function renderMy(){
  const el=$('#v-my'),H=holdings(),by={};
  (SUM&&SUM.items||[]).forEach(x=>by[x.code]=x);
  let rows='',tc=0,tv=0,w=0,n=0;
  H.forEach((h,i)=>{
    const s=by[h.code],px=s?s.price:null,mk=(s&&s.market)||h.market||'US';
    const ret=px?(px/h.price-1)*100:null;
    if(px&&h.qty){tc+=h.price*h.qty;tv+=px*h.qty}
    if(ret!=null){n++;if(ret>0)w++}
    let act='보유 · 관찰',k='idle',why='';
    if(ret!=null){const stop=h.price*0.92;
      if(ret<=-7){act='즉시 손절';k='fail';why=`${pct(ret)} — 오닐 -7~8% 원칙 도달`}
      else if(s&&s.sell>=65){act='전량 매도 검토';k='fail';why=`매도 압력 ${s.sell}점`}
      else if(ret>=25){act='2차 익절';k='warn';why=`${pct(ret)} — 잔량 정리 검토`}
      else if(ret>=20){act='1차 익절';k='warn';why=`${pct(ret)} — 절반 이상 실현`}
      else if(s&&s.sell>=45){act='절반 익절';k='warn';why=`매도 압력 ${s.sell}점`}
      else if(s&&s.kind==='fail'&&ret<0){act='비중 축소';k='fail';why='종목 상태 악화 + 평가손실'}
      else if(ret>0){act='보유 유지';k='pass';why=`${pct(ret)} · 손절선 ${money(stop,mk)}`}
      else why=`${pct(ret)} · 손절선 ${money(stop,mk)}`}
    else why='시세를 불러오지 못했습니다 (관심종목에 추가되어야 계산됩니다)';
    const R=ret!=null?ret/8:null;
    rows+=`<div class="card"><div class="row"><div class="g"><div class="nm">${esc((s&&s.name)||h.code)}</div>
      <div class="sub">${esc(h.code)} · ${esc(h.date)} · ${money(h.price,mk)}${h.qty?` × ${h.qty}주`:''}</div></div>
      <div><div class="px ${cls(ret)}">${ret!=null?pct(ret):'—'}</div>
        <div class="sub" style="text-align:right">${R!=null?`R ${R>=0?'+':''}${R.toFixed(1)}`:''}</div></div></div>
      <div style="margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${tag(act,k)}
        <span class="small">${esc(why)}</span></div>
      <div class="frow" style="margin:9px 0 0"><button class="btn gray sm" onclick="closeH(${i})">청산 기록</button>
        <button class="btn gray sm" onclick="delH(${i})">삭제</button></div></div>`});
  const tr=tc>0?(tv/tc-1)*100:null, closed=DB.get('closed',[]);
  let h='';
  if(H.length){
    h+=`<div class="grid2"><div class="card"><div class="k">평가 손익</div>
      <div class="v ${cls(tr)}" style="font-size:18px">${tc>0?money(tv-tc,'KR'):'—'}</div>
      <div class="d">${tc>0?`투자 ${money(tc,'KR')} → ${money(tv,'KR')}`:'수량 미입력'}</div></div>
      <div class="card"><div class="k">수익률 · 승률</div><div class="v ${cls(tr)}" style="font-size:18px">${tr!=null?pct(tr):'—'}</div>
      <div class="d">${w}/${n} 평가익 · 보유 ${H.length}종목${H.length>8?' <span class="dn">(분산 과다)</span>':''}</div></div></div>
      <div style="height:10px"></div>`+rows;
  } else h+=`<div class="empty">보유 종목이 없습니다.<br>아래에서 추가하면 매일 전략이 갱신됩니다.</div>`;
  h+=`<h2 class="sec">보유 추가</h2><div class="card">
    <div class="frow"><input id="hCode" placeholder="종목코드 · 티커"></div>
    <div class="frow"><input id="hDate" type="date"><input id="hPrice" type="number" step="any" placeholder="매수가"></div>
    <div class="frow"><input id="hQty" type="number" step="1" placeholder="수량 (선택)"></div>
    <button class="btn" onclick="subH()">추가</button>
    <div class="small" style="margin-top:8px">시세는 관심종목 데이터에서 가져옵니다. 목록에 없으면 먼저 추가하세요.</div></div>`;
  if(closed.length){
    const rs=closed.map(c=>c.ret).filter(v=>v!=null),ws=rs.filter(v=>v>0),ls=rs.filter(v=>v<=0);
    const aw=ws.length?ws.reduce((a,b)=>a+b,0)/ws.length:0, al=ls.length?ls.reduce((a,b)=>a+b,0)/ls.length:0;
    h+=`<h2 class="sec">청산 이력<small>${closed.length}건</small></h2><div class="grid2">
      <div class="card"><div class="k">승률</div><div class="v" style="font-size:18px">${rs.length?Math.round(ws.length/rs.length*100):0}%</div>
        <div class="d">${ws.length}승 ${ls.length}패</div></div>
      <div class="card"><div class="k">평균 수익/손실</div><div class="v" style="font-size:15px">${pct(aw)} / ${pct(al)}</div>
        <div class="d">${al!==0&&aw>=Math.abs(al)*3?'<span class="up">3배 이상 · 양호</span>':'수익이 손실의 3배 이상이어야 함'}</div></div></div>
      <div style="height:10px"></div><div class="tbl"><table><tr><th>종목</th><th>매수</th><th>청산</th><th>수익률</th></tr>
      ${closed.slice().reverse().map(c=>`<tr><td>${esc(c.code)}</td><td class="mono">${esc(c.date)}</td>
        <td class="mono">${esc(c.sell_date)}</td><td class="mono ${cls(c.ret)}">${pct(c.ret)}</td></tr>`).join('')}</table></div>
      <button class="btn gray sm" onclick="if(confirm('청산 이력을 지울까요?')){DB.set('closed',[]);renderMy()}">이력 삭제</button>`}
  h+=`<div class="read blue" style="margin-top:15px"><span class="h">오닐의 보유 관리</span>
    <b>① -7~8%면 무조건 손절</b> · <b>② +20~25%면 익절</b> (단, 돌파 후 3주 내 20%↑면 8주 보유) ·
    <b>③ 오른 종목을 팔고 내린 종목을 들고 있지 마세요.</b><br><br>
    <b>R 배수</b>는 손실 한 단위(8%)를 1R로 본 수익 배수입니다. -1R에서 끊고 +3R을 노리면 승률 40%로도 수익이 납니다.</div>`;
  el.innerHTML=h;
  const dt=document.getElementById('hDate'); if(dt&&!dt.value)dt.value=new Date().toISOString().slice(0,10);
}
function subH(){
  const c=(document.getElementById('hCode').value||'').trim().toUpperCase();
  const d=document.getElementById('hDate').value,p=parseFloat(document.getElementById('hPrice').value);
  const q=parseInt(document.getElementById('hQty').value||'0',10);
  if(!c||!p||!d){alert('종목·매수일·매수가를 입력하세요.');return}
  const H=holdings();H.push({code:c,date:d,price:p,qty:q||0,market:isKR(c)?'KR':'US'});
  saveH(H);renderMy();toast('추가했습니다')}
function delH(i){const H=holdings();H.splice(i,1);saveH(H);renderMy()}
function closeH(i){const H=holdings(),h=H[i];
  const s=(SUM&&SUM.items||[]).find(x=>x.code===h.code);
  if(!s){alert('현재가를 알 수 없어 청산 기록을 만들 수 없습니다.');return}
  const cl=DB.get('closed',[]);
  cl.push({...h,sell_date:new Date().toISOString().slice(0,10),sell_price:s.price,ret:(s.price/h.price-1)*100});
  DB.set('closed',cl);H.splice(i,1);saveH(H);renderMy();toast('청산 기록 완료')}

function watchlist(){ return DB.get('watchlist',(SUM&&SUM.items||[]).map(x=>x.code)) }
function ghCfg(){ return DB.get('gh',{owner:'',repo:'',token:'',branch:'main'}) }
function ghReady(){ const g=ghCfg(); return !!(g.owner&&g.repo&&g.token) }

async function addToWatch(code){
  code=String(code||'').trim().toUpperCase(); if(!code)return;
  const wl=watchlist(); if(!wl.includes(code)) wl.push(code);
  DB.set('watchlist',wl);
  if(ghReady()){
    toast('저장소에 반영 중…');
    const ok=await pushWatchlist(wl);
    if(ok){
      toast(code+' 반영 완료 · 분석 시작');
      try{ await triggerAnalysis(); }catch(e){}
      if(CUR==='stocks') renderStocks();
      else if(CUR==='home') renderHome();
    }
  } else {
    go('set');
    setTimeout(()=>alert(`${code} 를 휴대폰 관심목록에 추가했습니다.\n\n` +
      `분석까지 되게 하려면 아래 두 방법 중 하나가 필요합니다.\n` +
      `① GitHub 연동 설정 (한 번만 하면 이후 자동)\n` +
      `② "목록 JSON 복사" 후 저장소 data/watchlist.json 에 붙여넣기`),100);
  }
}
async function pushWatchlist(wl){
  const g=ghCfg();
  const path='data/watchlist.json';
  const body={items:wl.map(c=>({code:c}))};
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(body,null,2))));
  const base=`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`;
  const hdr={'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json'};
  for(let attempt=0; attempt<3; attempt++){
    try{
      let sha=null;
      const r0=await fetch(base+`?ref=${encodeURIComponent(g.branch||'main')}`,{headers:hdr,cache:'no-store'});
      if(r0.ok){ const j=await r0.json(); sha=j.sha; }
      const r=await fetch(base,{method:'PUT',headers:{...hdr,'Content-Type':'application/json'},
        body:JSON.stringify({message:'관심종목 갱신 (모바일)',content,branch:g.branch||'main',
          ...(sha?{sha}:{})})});
      if(r.status===409) continue;
      if(!r.ok){ const t=await r.text(); throw new Error(r.status+' '+t.slice(0,120)); }
      return true;
    }catch(e){
      if(attempt===2){ alert('저장소 반영 실패: '+e.message+'\n\n설정에서 GitHub 정보를 확인하세요.'); return false; }
    }
  }
  alert('저장소 반영 실패: 파일이 계속 변경되고 있습니다. 잠시 후 다시 시도하세요.');
  return false;
}
async function testGh(){
  const g=ghCfg();
  if(!ghReady()){alert('소유자·저장소·토큰을 모두 입력하세요.');return}
  try{
    const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}`,
      {headers:{'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json'}});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    alert(`연결 성공\n\n저장소: ${j.full_name}\n기본 브랜치: ${j.default_branch}`);
  }catch(e){ alert('연결 실패: '+e.message+'\n토큰 권한(Contents: Read and write)을 확인하세요.'); }
}

/* ══════════ 설정 ══════════ */
function renderSet(){
  const el=$('#v-set'),wl=watchlist(),on=DB.get('notify:on',false),at=DB.get('cache:at',null),g=ghCfg();
  let h=`<h2 class="sec">알림</h2><div class="card">
    <div class="row"><div class="g"><b style="font-size:13px">매수 구간 · 매도 압력 알림</b>
      <div class="small" style="margin-top:3px">앱을 열 때마다 새로 진입한 종목만 알립니다.</div></div>
      ${tag(on?'켜짐':'꺼짐',on?'pass':'idle')}</div>
    <div class="frow" style="margin:10px 0 0"><button class="btn ${on?'gray':''}" onclick="toggleNotify()">${on?'끄기':'켜기'}</button>
      <button class="btn ghost" onclick="testNotify()">테스트</button></div></div>

  <h2 class="sec">GitHub 연동<small>${ghReady()?'설정됨':'미설정'}</small></h2>
  <div class="card">
    <div class="small" style="margin-bottom:9px">연동하면 앱에서 종목을 추가할 때 저장소가 자동 갱신되고
      Actions가 실행되어 <b>2~3분 뒤 분석 결과</b>가 나옵니다. 토큰은 이 휴대폰에만 저장됩니다.</div>
    <div class="frow"><input id="ghOwner" placeholder="GitHub 아이디" value="${esc(g.owner)}">
      <input id="ghRepo" placeholder="저장소 이름" value="${esc(g.repo)}"></div>
    <div class="frow"><input id="ghToken" type="password" placeholder="Personal Access Token" value="${esc(g.token)}"></div>
    <div class="frow"><button class="btn" onclick="saveGh()">저장</button>
      <button class="btn ghost" onclick="testGh()">연결 테스트</button></div>
    <details style="margin-top:9px"><summary>토큰 만드는 법</summary><div class="body">
      1. github.com → 우측 상단 프로필 → <b>Settings</b><br>
      2. 왼쪽 맨 아래 <b>Developer settings</b><br>
      3. <b>Personal access tokens</b> → <b>Fine-grained tokens</b> → Generate new token<br>
      4. Repository access → <b>Only select repositories</b> → 이 저장소 선택<br>
      5. Permissions → Repository permissions → <b>Contents</b> 를 <b>Read and write</b> 로<br>
      6. Generate token → 나온 문자열을 위에 붙여넣기<br><br>
      <span class="small">토큰은 휴대폰 저장소(localStorage)에만 저장되며 외부로 전송되지 않습니다.
      다만 분실 위험이 있으니 이 저장소에만 권한을 주세요.</span></div></details>
  </div>

  <h2 class="sec">관심종목<small>${wl.length}종목</small></h2>
  <div class="card">
    <div class="frow"><input id="wlAdd" placeholder="추가할 코드">
      <button class="btn sm" onclick="wlPush()">추가</button></div>
    <div style="margin-top:5px">${wl.map((c,i)=>`<span class="chip" onclick="wlDel(${i})">${esc(c)} ✕</span>`).join('')||'<span class="small">없음</span>'}</div>
    <div class="frow" style="margin-top:9px">
      <button class="btn ghost" onclick="syncNow()">${ghReady()?'저장소에 반영':'목록 JSON 복사'}</button></div>
  </div>

  <h2 class="sec">데이터</h2><div class="card">
    <div class="d">마지막 갱신 · <b class="mono">${SUM?esc(SUM.asof_kr||''):'—'}</b><br>
      기기 캐시 · <span class="mono">${at?new Date(at).toLocaleString('ko-KR'):'—'}</span></div>
    <div class="frow" style="margin-top:9px"><button class="btn" onclick="refresh(true)">새로고침</button>
      <button class="btn gray" onclick="clearCache()">캐시 비우기</button></div></div>`;
  if(SUM&&SUM.log&&SUM.log.length){
    const f=SUM.log.filter(l=>l.status!=='성공');
    h+=`<details><summary>데이터 수집 로그 ${f.length?`(실패 ${f.length})`:'(정상)'}</summary><div class="body">
      <table><tr><th>항목</th><th>상태</th><th>내용</th></tr>
      ${SUM.log.map(l=>`<tr><td>${esc(l.section)}</td>
        <td>${tag(l.status,l.status==='성공'?'pass':l.status==='재시도'?'warn':'fail')}</td>
        <td class="mut">${esc(l.msg)}</td></tr>`).join('')}</table></div></details>`}
  h+=`<h2 class="sec">앱 정보</h2><div class="card"><div class="d">
    <b>홈 화면에 추가</b>하면 앱처럼 쓸 수 있습니다.<br>
    · iPhone: Safari 공유 버튼 → "홈 화면에 추가"<br>· Android: Chrome 메뉴(⋮) → "홈 화면에 추가"<br><br>
    데이터는 GitHub Actions가 장 마감 후 자동 갱신합니다. 인터넷이 끊겨도 마지막 데이터로 볼 수 있습니다.</div></div>`;
  el.innerHTML=h;
}
function saveGh(){
  DB.set('gh',{owner:(document.getElementById('ghOwner').value||'').trim(),
    repo:(document.getElementById('ghRepo').value||'').trim(),
    token:(document.getElementById('ghToken').value||'').trim(),branch:'main'});
  renderSet();toast('저장했습니다')}
async function syncNow(){
  const wl=watchlist();
  if(ghReady()){ toast('반영 중…'); if(await pushWatchlist(wl))
    alert('저장소에 반영했습니다.\nActions가 자동 실행되며 2~3분 뒤 데이터가 갱신됩니다.'); }
  else{ const j=JSON.stringify({items:wl.map(c=>({code:c}))},null,2);
    const done=()=>alert('복사했습니다.\n\nGitHub 저장소의 data/watchlist.json 을 열어\n전체를 지우고 붙여넣은 뒤 Commit 하세요.');
    if(navigator.clipboard)navigator.clipboard.writeText(j).then(done).catch(()=>prompt('복사하세요',j));
    else prompt('복사하세요',j)}}
async function toggleNotify(){
  if(DB.get('notify:on',false)){DB.set('notify:on',false);renderSet();return}
  const p=await askNotify();
  if(p==='granted'){DB.set('notify:on',true);DB.set('alerts:seen',{});runAlerts();toast('알림을 켰습니다')}
  else alert(p==='unsupported'?'이 브라우저는 알림을 지원하지 않습니다. 홈 화면에 추가한 뒤 다시 시도해 보세요.'
    :'알림 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.');
  renderSet()}
function testNotify(){ if(window.Notification&&Notification.permission==='granted')
  fireNotify('알림 테스트','매수 가능 구간에 들어오면 이렇게 알려드립니다.','test');
  else alert('먼저 알림을 켜주세요.')}
function wlPush(){const v=(document.getElementById('wlAdd').value||'').trim().toUpperCase();
  if(v)addToWatch(v).then?addToWatch(v):null; renderSet()}
function wlDel(i){const wl=watchlist();const code=wl[i];wl.splice(i,1);DB.set('watchlist',wl);renderSet();
  if(ghReady()) pushWatchlist(wl).then(ok=>{if(ok)toast(code+' 삭제 + 저장소 반영')})}
async function removeFromWatch(code){
  code=String(code||'').trim().toUpperCase();
  if(!code)return;
  if(!confirm(code+' 를 관심종목에서 삭제할까요?'))return;
  const wl=watchlist().filter(c=>c!==code);
  DB.set('watchlist',wl);
  toast(code+' 삭제됨');
  if(ghReady()){
    const ok=await pushWatchlist(wl);
    if(ok) toast(code+' 저장소에서도 제거됨');
  }
  if(CUR==='stocks') renderStocks();
  else if(CUR==='set') renderSet();
  else if(CUR==='home') renderHome();
}

/* ══════════ 내비 ══════════ */
const RENDER={home:renderHome,market:renderMarket,stocks:renderStocks,school:renderSchool,my:renderMy,set:renderSet};
function go(v){CUR=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#hdTitle').textContent={home:'오닐 터미널',market:'시장',stocks:'종목',school:'차트스쿨',my:'내 투자',set:'설정'}[v]||'오닐 터미널';
  try{(RENDER[v]||renderHome)()}catch(e){
    document.getElementById('v-'+v).innerHTML=`<div class="empty">화면을 그리는 중 오류가 발생했습니다.<br>
      <span class="small">${esc(e.message||e)}</span></div>`}
  window.scrollTo({top:0})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
  function clearCache(){
  try{
    const keys=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('oneil:cache')) keys.push(k);
    }
    keys.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  SUM=null; DETAIL={};
  toast('캐시를 비웠습니다. 다시 불러오는 중…');
  refresh(true);
}
async function refresh(force){
  const b=$('#btnRefresh');b.innerHTML='<span class="spin"></span>';
  try{ await loadSummary(force); $('#hdAs').textContent=SUM?(SUM.asof_kr||''):'—';
    DETAIL={}; runAlerts(); go(CUR);
  }catch(e){ $('#v-home').innerHTML=`<div class="empty">데이터를 불러오지 못했습니다.<br>
    <span class="small">${esc(e.message||e)}</span><br><br>
    <span class="small">저장소에 <b>data/summary.json</b> 이 있는지,<br>Actions를 한 번 실행했는지 확인하세요.</span></div>`}
  b.innerHTML='↻'}
(async function init(){
  if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('sw.js')}catch(e){}}
  if(SUM)$('#hdAs').textContent=SUM.asof_kr||'';
  go('home'); await refresh(false);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(false)});
})();
</script>
